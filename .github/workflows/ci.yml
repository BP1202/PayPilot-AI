name: PayPilot CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://${{secrets.POSTGRES_USER}}:${{secrets.POSTGRES_PASSWORD}}@localhost:5433/paypilot_ai
      POSTGRES_USER: ${secrets.POSTGRES_USER}
      POSTGRES_PASSWORD: ${secrets.POSTGRES_PASSWORD}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: paypilot_ai
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      PAYPAL_CLIENT_ID: mock-paypal-client-id
      PAYPAL_CLIENT_SECRET: mock-paypal-client-secret
      AI_API_KEY: mock-ai-key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check backend/app backend/tests

      - name: Run Ruff Format Checks
        run: |
          ruff format --check backend/app backend/tests

      - name: Run Pytest with Coverage
        run: |
          PYTHONPATH=backend pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml

      - name: Verify Alembic Migration Configuration
        run: |
          PYTHONPATH=backend alembic -c backend/alembic.ini heads
