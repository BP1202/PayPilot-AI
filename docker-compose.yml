services:
  db:
    image: postgres:18
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paypilot_ai
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - paypilot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paypilot_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  paypilot_postgres_data:

